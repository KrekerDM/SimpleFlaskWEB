<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tittel }} &middot; Jan Nazar Havdal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="ark">

        <header>
            <h1>{{ tittel }}</h1>
            <span class="stempel">Gjestebok</span>
        </header>

        <section class="skjemaside">

            <img src="{{ url_for('static', filename='img/' + bilde) }}" alt="{{ bilde_tekst }}">

            <div>
                <form class="skjema" method="post" action="{{ handling }}">
                    <label for="brukernavn">Brukernavn</label>
                    <input type="text" id="brukernavn" name="brukernavn" maxlength="20" autocomplete="username"
                        autofocus required>

                    <label for="passord">Passord</label>
                    <input type="password" id="passord" name="passord" autocomplete="current-password" required>

                    <p class="skjemafeil" role="status">{{ feil if feil }}</p>

                    <button type="submit">{{ knapp }}</button>
                </form>

                <p class="skjemalenker">
                    <a href="{{ annen_url }}">{{ annen_tekst }}</a>
                    &middot;
                    <a href="/">Tilbake til forsiden</a>
                </p>
            </div>

        </section>

    </div>

</body>

</html>
