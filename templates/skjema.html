{% extends 'base.html' %}

{% block tittel %}{{ tittel }} &middot; Jan Nazar Havdal{% endblock %}
{% block overskrift %}{{ tittel }}{% endblock %}
{% block stempel %}<span class="stempel">Gjestebok</span>{% endblock %}

{% block innhold %}

<section class="skjemaside">

    <img src="{{ url_for('static', filename='img/' + bilde) }}" alt="{{ bilde_tekst }}">

    <div>
        <form class="skjema" method="post" action="{{ handling }}">
            <label for="brukernavn">Brukernavn</label>
            <input type="text" id="brukernavn" name="brukernavn" maxlength="20" autocomplete="username" autofocus
                required>

            <label for="passord">Passord</label>
            <input type="password" id="passord" name="passord" autocomplete="current-password" required>

            <p class="skjemafeil" role="status">{{ feil if feil }}</p>

            <button type="submit">{{ knapp }}</button>
        </form>

        <p class="skjemalenker">
            <a href="{{ annen_url }}">{{ annen_tekst }}</a>
            &middot;
            <a href="/">Forsiden</a>
        </p>
    </div>

</section>

{% endblock %}
